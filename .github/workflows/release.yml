name: Release

# Tags a release only after the *deployed* build - not a local one - passes the
# smoke suite. Run it from the Actions tab on main once CI has deployed the commit
# you want to release. See docs/release.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0-rc.1 or v1.0.0 (must match package.json version)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Verify the deployment and tag it
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      SITE_URL: https://joecer21.github.io/Piano-Practice/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Validate the tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N"; exit 1
          fi
          if [[ "${TAG#v}" != "$VERSION" && "${TAG#v}" != "$VERSION"-rc.* ]]; then
            echo "::error::$TAG does not match package.json version $VERSION"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"; exit 1
          fi

      - name: Confirm the site serves this commit
        run: node scripts/wait-for-deploy.mjs "$SITE_URL" "$GITHUB_SHA" 120

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the deployed site
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: ${{ env.SITE_URL }}
          SMOKE_EXPECTED_COMMIT: ${{ github.sha }}

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$TAG" == *-rc.* ]] && PRERELEASE="--prerelease"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes $PRERELEASE

      - name: Upload smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-report
          path: |
            playwright-smoke-report
            test-results
          retention-days: 30
