name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a PR branch previously triggered both the push and pull_request
# workflows, running everything twice, and superseded runs kept going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # The fingerprints are the regression guards for the engine: they fail if any
      # case produces different music, or a different Score interpretation of it,
      # than the frozen baselines.
      - name: Verify musical and Score fingerprints
        run: npm run fingerprint
      - name: Verify musical audition corpus and listening dispositions
        run: npm run audit:music
      - run: npm run build
      - name: Check the learner download against its measured budget
        run: npm run budget
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Playwright browsers were re-downloaded on every run (~150 MB plus apt
      # dependencies). Cache them against the resolved Playwright version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:browser

      # trace: "on-first-retry" was configured and retries: 2 is set on CI, so
      # traces were being produced - they were simply never uploaded, which made
      # them unreachable.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [quality, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy the exact bundle the quality and browser jobs verified, not a rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test the deployed site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages to serve this commit
        run: node scripts/wait-for-deploy.mjs "${{ needs.deploy.outputs.page_url }}" "${{ github.sha }}" 900
      - name: Run the deployed smoke suite
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          SMOKE_EXPECTED_COMMIT: ${{ github.sha }}
      - name: Upload smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-smoke-report
            test-results
          retention-days: 14
